<!doctype html>
<html lang="es">
<head>

<body>
  <!-- Skip link para saltar al contenido (a11y) -->
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <div class="brand">MANACO</div>

      <!-- Checkbox oculto para menú hamburguesa -->
      <input type="checkbox" id="menu-toggle" class="menu-checkbox" />
      <label for="menu-toggle" class="menu-icon" aria-label="Abrir menú">
        <span></span>
        <span></span>

          <li><a href="#contacto">Contacto</a></li>
        </ul>

            <p class="price">$00.00</p>
            <a class="btn" href="#" role="button">Comprar</a>

              %3C/svg%3E" alt="Imagen del Producto 2 (placeholder)" width="200" height="200" />

            <img src="data:image/svg+xml;charset=UTF-8,

    <div class="container">

</html>
